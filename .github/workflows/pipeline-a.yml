name: Pipeline A (Vanity / Speed-Optimized)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-green-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install minimal test runner
        run: pip install pytest ruff bandit

      # CI Bad Smell: static analysis and security warnings are suppressed
      - name: Lint (suppressed)
        continue-on-error: true
        run: ruff check src/ tests/

      - name: Security scan (suppressed)
        continue-on-error: true
        run: bandit -r src/

      # Skips integration, order-randomization, and concurrency checks for speed
      - name: Run unit tests only
        run: python -m pytest tests/test_unit.py -q
